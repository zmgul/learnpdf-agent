[tool.poetry]
name = "learnpdf-agent"
version = "0.1.0"
description = "Herhangi bir PDF üzerinde soru-cevap yapılabilen genel bir öğrenme aracı — kaynak gösteren yanıtlar"
authors = ["Zehra <zehramervegul@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" },
    { include = "api" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.7"
pymupdf = "^1.24"
chromadb = "^0.5"
sentence-transformers = "^3.0"
anthropic = "^0.30"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
httpx = "^0.27"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
